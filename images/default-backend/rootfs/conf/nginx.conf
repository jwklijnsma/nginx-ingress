# Default backend for the Bitnami-style chart: same layout as docker.io/bitnami/nginx
# (port 8080, server-block snippets from /opt/bitnami/nginx/conf/bitnami/*.conf),
# running the patched NGINX from ghcr.io/<owner>/nginx-ingress/nginx.
# Everything writable lives in /opt/bitnami/nginx/tmp, so a read-only root
# filesystem works (the chart mounts an emptyDir there and on /tmp).
#
# Note: this NGINX build has no `root`/`alias` directives (ingress-nginx
# hardening). Server blocks can use return/proxy_pass/lua, not static files.

worker_processes  auto;
error_log         stderr warn;
pid               /opt/bitnami/nginx/tmp/nginx.pid;

events {
  worker_connections  1024;
}

http {
  default_type             text/plain;
  access_log               /dev/stdout;
  server_tokens            off;
  client_body_temp_path    /opt/bitnami/nginx/tmp/client_body;
  proxy_temp_path          /opt/bitnami/nginx/tmp/proxy;
  fastcgi_temp_path        /opt/bitnami/nginx/tmp/fastcgi;

  server {
    listen       8080 default_server;
    server_name  _;
    include      /opt/bitnami/nginx/conf/bitnami/*.conf;
  }
}
